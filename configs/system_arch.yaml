# Hyperparameter sweep configuration.
# The sweep runs on the dataset chosen for the RAG demo (configs/rag.yaml -> rag.dataset),
# but can be overridden via CLI.

dataset: "scifact"

# Which axes to sweep. Set any axis to an empty list to skip it.
chunk_sizes: [256, 512, 768, 1024]
top_k_values: [5, 10, 15, 20]
hybrid_alphas: [0.0, 0.25, 0.5, 0.75, 1.0]

# For tractability, the sweep is two-stage:
#   stage A: vary alpha at fixed chunk_size + top_k (the default "best guess")
#   stage B: vary chunk_size at fixed alpha + top_k
#   stage C: vary top_k at fixed alpha + chunk_size
# This keeps the sweep small enough to run on a laptop while still covering all three axes.
sweep_strategy: "axis_aligned"

defaults:
  chunk_size: 256
  top_k: 10
  hybrid_alpha: 0.5

output:
  csv_path: "data/results/sweep_results.csv"
  plot_path: "images/sweep_ndcg10.png"
