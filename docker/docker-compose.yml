# Local Weaviate instance.
# BYO-vectors mode: no vectorizer module is enabled; push embeddings ourselves.
# Persisted volume so collections survive container restarts during sweeps.

services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.0
    container_name: container_weaviate
    restart: unless-stopped
    ports:
      - "18080:8080"     # host 18080 -> container Weaviate HTTP 8080
      - "15051:50051"    # host 15051 -> container Weaviate gRPC 50051
    environment:
      QUERY_DEFAULTS_LIMIT: 20  # Similar to the max Top K retrieval chunks
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "jpm"
      QUERY_MAXIMUM_RESULTS: 10000  # there are not datasets with more than <= 10k docs
      DISK_USE_READONLY_PERCENTAGE: 95
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  weaviate_data:
    name: container_weaviate_data
