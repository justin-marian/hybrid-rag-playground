name: Auto Research Experiments

on:
  workflow_dispatch:
    inputs:
      config-path:
        description: "Path to the auto research YAML config"
        required: false
        default: "configs/auto_research.yml"
      run-rag:
        description: "Run Hybrid-RAG Beir stages"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  push:
    branches:
      - main
    paths:
      - "src/**"
      - "configs/**"
      - "scripts/run_auto_research.py"
      - ".github/workflows/auto_research.yml"
      - "pyproject.toml"

jobs:
  auto-research:
    name: Run auto research experiments
    runs-on: ubuntu-latest
    timeout-minutes: 360

    services:
      weaviate:
        image: semitechnologies/weaviate:1.25.6
        ports:
          - 8001:8001
          - 15051:15051
        env:
          QUERY_DEFAULTS_LIMIT: 25
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
          DEFAULT_VECTORIZER_MODULE: "none"
          CLUSTER_HOSTNAME: "node1"

    env:
      PYTHONUNBUFFERED: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONPATH: ${{ github.workspace }}
      AUTO_RESEARCH_CONFIG: ${{ github.event.inputs.config-path || 'configs/auto_research.yml' }}
      RUN_RAG: ${{ github.event.inputs.run-rag || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f pyproject.toml ]; then
            pip install -e .
          fi

          pip install pyyaml

      - name: Create output directories
        shell: bash
        run: |
          mkdir -p logs/auto_research data/results images

      - name: Wait for Weaviate
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8001/v1/.well-known/ready; then
              echo "Weaviate is ready."
              exit 0
            fi

            echo "Waiting for Weaviate..."
            sleep 2
          done

          echo "Weaviate did not become ready."
          exit 1

      - name: Run auto research plan
        shell: bash
        run: |
          python3 scripts/run_auto_research.py

      - name: Upload experiment artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto-research-results
          path: |
            logs/auto_research/
            data/results/
            images/
          if-no-files-found: warn
