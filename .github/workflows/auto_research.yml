name: Auto Research Experiments

on:
  workflow_dispatch:
    inputs:
      config-path:
        description: "Path to the auto research YAML config"
        required: false
        default: "configs/auto_research.yml"
      run-rag:
        description: "Run Hybrid-RAG BEIR Stages"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  push:
    branches:
      - main
    paths:
      - "src/**"
      - "configs/**"
      - "scripts/run_auto_research.py"
      - ".github/workflows/auto_research.yml"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  auto-research:
    name: Run auto research experiments
    runs-on: ubuntu-latest
    timeout-minutes: 360

    services:
      weaviate:
        image: cr.weaviate.io/semitechnologies/weaviate:1.27.0
        ports:
          - 18080:8080
          - 15051:50051
        env:
          QUERY_DEFAULTS_LIMIT: 25
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
          DEFAULT_VECTORIZER_MODULE: "none"
          ENABLE_MODULES: ""
          CLUSTER_HOSTNAME: "jpm"
          QUERY_MAXIMUM_RESULTS: 10000
          DISK_USE_READONLY_PERCENTAGE: 95
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8080/v1/.well-known/ready || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      PYTHONUNBUFFERED: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONPATH: ${{ github.workspace }}
      AUTO_RESEARCH_CONFIG: ${{ github.event.inputs.config-path || 'configs/auto_research.yml' }}
      RUN_RAG: ${{ github.event.inputs.run-rag || 'false' }}
      WEAVIATE_URL: "http://localhost:18080"

      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_XET: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        shell: bash
        run: |
          uv python install 3.11

      - name: Install dependencies
        shell: bash
        run: |
          uv sync --python 3.11
          uv pip install pyyaml python-dotenv

      - name: Show runtime info
        shell: bash
        run: |
          pwd
          python --version || true
          uv run python --version
          echo "PYTHONPATH=$PYTHONPATH"
          echo "AUTO_RESEARCH_CONFIG=$AUTO_RESEARCH_CONFIG"
          echo "RUN_RAG=$RUN_RAG"

      - name: Create output directories
        shell: bash
        run: |
          mkdir -p logs/auto_research data/results images

      - name: Wait for Weaviate
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:18080/v1/.well-known/ready; then
              echo "Weaviate is ready."
              exit 0
            fi

            echo "Waiting for Weaviate..."
            sleep 2
          done

          echo "Weaviate did not become ready."
          exit 1

      - name: Validate auto research config
        shell: bash
        run: |
          test -f "$AUTO_RESEARCH_CONFIG"
          echo "Found config: $AUTO_RESEARCH_CONFIG"

      - name: Run auto research plan
        shell: bash
        run: |
          uv run python scripts/run_auto_research.py

      - name: Upload experiment artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: auto-research-results
          path: |
            logs/auto_research/
            data/results/
            images/
          if-no-files-found: warn
